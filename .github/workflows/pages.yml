# Builds and tests the web app in web/. Pushes to main also publish it to GitHub Pages;
# pull requests only build and test. Can be started by hand from the Actions tab.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "tools/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["web/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Nothing by default; each job gets only what it needs.
permissions: {}

# One deployment at a time. Each pull request gets its own group, and a newer push to it
# cancels the older check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # npm ci runs third-party install scripts, so this job can only read the repo.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The firmware tests skip themselves here: no firmware image is ever in the repo.
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
