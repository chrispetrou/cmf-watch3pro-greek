# Builds and tests the web app in web/. Actions are pinned to commit SHAs, since tags can be moved;
# Dependabot keeps the pins up to date. Pushes to main also publish it to GitHub Pages;
# pull requests only build and test. Can be started by hand from the Actions tab.
# Every pull request runs it, whatever it changes: "build" is a required check for merging into main.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "tools/**", ".github/workflows/pages.yml"]
  pull_request:
  workflow_dispatch:

# Nothing by default; each job gets only what it needs.
permissions: {}

# One deployment at a time. Each pull request gets its own group, and a newer push to it
# cancels the older check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # This job can only read the repo, and npm ci skips the packages' install scripts
    # (none are needed: esbuild's binary comes in a platform package).
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      # The firmware tests skip themselves here: no firmware image is ever in the repo.
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
